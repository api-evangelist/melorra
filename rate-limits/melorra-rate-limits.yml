exhaustion_status: unknown
agent_impact: >-
  Because access is anonymous there is no key to attribute a quota to, and because no headers are
  returned there is no runtime signal an agent can back off on. An agent cannot distinguish
  "approaching a limit" from "healthy" and will discover any limit only as an unexplained failure.
  Any limiting that exists is upstream (nginx or the Google frontend named in the via header) and
  invisible to the consumer.
recommendation: >-
  Consumers should self-throttle conservatively and treat 5xx as potentially load-shed. Note the
  catalog is large (21,742 gold/diamond/gemstone products at 20 per page, plus 165 silver), so a
  full crawl is roughly 1,100 requests against an endpoint with no published budget.
