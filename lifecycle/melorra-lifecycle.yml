  published: false
  probes:
  - url: https://www.melorra.com/changelog
    status: 404
sla:
  published: false
  detail: No API SLA, uptime commitment or support tier is published for the catalog API.
support:
  channel: https://www.melorra.com/contactus/
  detail: >-
    General retail customer care only. There is no developer support channel, no forum, and no
    documented contact for API consumers specifically.
stability_assessment:
  grade: undocumented
  detail: >-
    The API is undocumented as a product. It is reachable and stable in observation, but Melorra
    makes no public commitment to keep any endpoint, field or shape in place, and offers no channel
    on which a breaking change would be announced. Treat every field as subject to silent change.
corporate:
  note: >-
    In January 2026 Senco Gold approved acquiring a controlling 68% stake in August Jewellery Pvt
    Ltd, the company behind Melorra. An ownership change of this kind is a material lifecycle risk
    for an undocumented, uncommitted API surface.
