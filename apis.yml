aid: melorra
name: Melorra
description: >-
  Melorra is an Indian direct-to-consumer fine jewellery brand, founded in 2015 and operated by
  August Jewellery Pvt Ltd, selling lightweight, fashion-led gold, diamond, gemstone and silver
  jewellery designed for everyday and workwear rather than for weddings. It sells online at
  melorra.com and through an app and a network of experience centres, delivering BIS-hallmarked
  gold and IGI/SGL-certified stones across hundreds of Indian districts. Melorra runs a public,
  unauthenticated catalog API at services-catalog.melorra.com and — unusually for a retailer —
  publishes both an llms.txt and a machine-readable /.well-known/api-catalog document describing
  it, giving AI agents a documented path into a 21,000-product jewellery catalog. In January 2026
  Senco Gold agreed to acquire a controlling 68% stake in August Jewellery.
