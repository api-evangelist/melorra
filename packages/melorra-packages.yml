summary: >-
  Melorra publishes five first-party npm packages under the @melorra scope, all of them internal
  design-system libraries rather than clients for the catalog API. There is NO client SDK for the
  Melorra Catalog API in any language, from Melorra or anyone else. Every package below last shipped
  in 2023 and none has reached a 0.1 release.
sdk_for_api: false
sdk_note: >-
  These are deliberately NOT wired as a `SDKs` pointer in apis.yml. They are UI component, theme,
  schema and type packages for Melorra's own storefront, not API client libraries, and crediting
  them as API SDKs would misrepresent what a developer integrating the catalog API can pick up.
