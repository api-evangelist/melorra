ownership_evidence: >-
  All five are published by the npm maintainer `soumya-melorra` under the @melorra scope and declare
  repositories in the github.com/MelorraTech organization, which exists (HTTP 200) and is Melorra's
  engineering org. That is a consistent first-party chain, so official: true is justified.
